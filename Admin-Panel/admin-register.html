<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Register - Class Schedule Maker</title>
    <link rel="icon" type="image/png" href="images/logo.jpg">
    <link rel="apple-touch-icon" href="images/logo.jpg">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-card">
        <div class="auth-logo">🛡️</div>
        <h2>Create admin account</h2>
        <p class="auth-sub">Choose a username and password for the admin panel.</p>

        <div class="field">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" placeholder="At least 3 characters" autofocus
                autocomplete="username">
        </div>

        <div class="field">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" placeholder="At least 6 characters"
                autocomplete="new-password">
        </div>

        <div class="field">
            <label for="regConfirm">Confirm Password</label>
            <input type="password" id="regConfirm" placeholder="Type the password again"
                autocomplete="new-password">
        </div>

        <div class="field">
            <label for="regCode">Admin Code</label>
            <input type="password" id="regCode" placeholder="Leave blank if you are the first admin"
                autocomplete="off" onkeydown="if(event.key==='Enter') adminRegister()">
        </div>

        <button type="button" class="create-btn" id="registerBtn" onclick="adminRegister()">Create Admin Account</button>

        <p class="auth-switch">Already an admin? <a href="admin-login.html">Login</a></p>

        <p class="copyright">© 2026 Winnce Tubtub. All rights reserved.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="auth.js"></script>
    <script>
        const ADMIN_SESSION_KEY = "csm_admin_user";

        async function adminRegister() {
            const username = document.getElementById("regUsername").value.trim().replace(/\s+/g, " ");
            const password = document.getElementById("regPassword").value;
            const confirmPassword = document.getElementById("regConfirm").value;
            const code = document.getElementById("regCode").value;

            if (username.length < 3) {
                notify("Username must be at least 3 characters.", "warning");
                return;
            }

            if (password.length < 6) {
                notify("Password must be at least 6 characters.", "warning");
                return;
            }

            if (password !== confirmPassword) {
                notify("The two passwords do not match.", "warning");
                return;
            }

            if (!USE_SUPABASE) {
                notify("Supabase is not configured in auth.js.", "error");
                return;
            }

            const btn = document.getElementById("registerBtn");
            btn.disabled = true;

            try {
                await sb("rpc/admin_register", {
                    method: "POST",
                    body: { p_username: username, p_password: password, p_code: code }
                });

                sessionStorage.setItem(ADMIN_SESSION_KEY, username);

                await Swal.fire({
                    icon: "success",
                    title: "Admin account created!",
                    text: "Welcome, " + username + ".",
                    timer: 1500,
                    showConfirmButton: false,
                    timerProgressBar: true
                });

                window.location.href = "admin.html";

            } catch (error) {
                console.error(error);

                const message = String(error.message || "");

                if (message.includes("bad_code")) {
                    notify("Wrong admin code. Only the first admin can register without a code.", "error", "Not allowed");
                } else if (message.includes("invalid_input")) {
                    notify("Please check your username and password.", "warning");
                } else if (error.status === 409 || message.includes("23505")) {
                    notify("That username is already taken.", "error", "Already registered");
                } else if (error.status === 404) {
                    notify("The admin register function was not found. Run admin-setup.sql in the Supabase SQL Editor first.", "error");
                } else {
                    notify("Could not register. Please check your connection and Supabase settings.", "error");
                }
            } finally {
                btn.disabled = false;
            }
        }

        // already logged in? go straight to the admin panel
        document.addEventListener("DOMContentLoaded", function () {
            if (sessionStorage.getItem(ADMIN_SESSION_KEY)) {
                window.location.href = "admin.html";
            }
        });
    </script>

</body>

</html>
