<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Class Schedule Maker</title>
    <link rel="icon" type="image/png" href="images/logo.jpg">
    <link rel="apple-touch-icon" href="images/logo.jpg">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #315bea;
            --secondary: #7048e8;
            --dark: #172554;
            --bg: #f4f6fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #202b45;
            min-height: 100vh;
        }

        [hidden] {
            display: none !important;
        }

        .admin-name {
            font-size: 13px;
            align-self: center;
            opacity: .9;
        }

        /* HEADER */

        header {
            background: linear-gradient(120deg, #183caa, #6545d9, #8849e9);
            padding: 30px 20px 60px;
            color: white;
        }

        .header-content {
            max-width: 1300px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: rgba(255, 255, 255, .18);
            padding: 13px;
            border-radius: 14px;
            font-size: 25px;
        }

        header h1 {
            font-size: 27px;
            font-weight: 800;
        }

        header p {
            margin-top: 6px;
            opacity: .85;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-actions a,
        .header-actions button {
            background: rgba(255, 255, 255, .2);
            color: white;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        /* MAIN */

        .container {
            max-width: 1300px;
            margin: -35px auto 50px;
            padding: 0 20px;
            position: relative;
            z-index: 3;
        }

        .panel {
            background: white;
            border-radius: 18px;
            padding: 27px;
            margin-bottom: 25px;
            box-shadow: 0 8px 35px rgba(35, 52, 100, .07);
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border-radius: 16px;
            padding: 20px 22px;
            box-shadow: 0 8px 35px rgba(35, 52, 100, .07);
        }

        .stat small {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .5px;
            color: #8992a9;
            margin-bottom: 6px;
        }

        .stat strong {
            font-size: 28px;
            color: var(--dark);
        }

        /* TABS */

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .tab {
            background: #f0f2f8;
            color: #53617e;
        }

        .tab.active {
            color: white;
            background: linear-gradient(120deg, #315bea, #7048e8);
        }

        /* TOOLBAR */

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 18px;
        }

        .toolbar .grow {
            flex: 1;
            min-width: 200px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e1e5ef;
            background: #fafbff;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 13px;
            color: #273451;
            transition: .25s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(49, 91, 234, .10);
        }

        .toolbar select {
            width: auto;
            min-width: 220px;
        }

        /* BUTTONS */

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: .25s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, .12);
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .create-btn {
            color: white;
            background: linear-gradient(120deg, #315bea, #7048e8);
        }

        .edit-btn {
            background: #eaf0ff;
            color: #315bea;
            padding: 8px 12px;
        }

        .view-btn {
            background: #e5f7e5;
            color: #159b69;
            padding: 8px 12px;
        }

        .delete-btn {
            background: #fff0f0;
            color: #dc3545;
            padding: 8px 12px;
        }

        .danger-btn {
            background: #dc3545;
            color: white;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* TABLE */

        .table-wrapper {
            overflow-x: auto;
            border-radius: 10px;
        }

        table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #d5d9e6;
            text-align: center;
            padding: 12px;
            font-size: 12px;
        }

        th {
            background: #dedede;
            color: #29344c;
            font-weight: 800;
        }

        td.left {
            text-align: left;
        }

        .muted {
            color: #8992a9;
        }

        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            background: #eaf0ff;
            color: #315bea;
            font-weight: 700;
            font-size: 11px;
        }

        .swatch {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 1px solid #aab;
            margin-right: 6px;
            vertical-align: middle;
        }

        #errorBanner {
            background: #fff0f0;
            color: #b91c1c;
            border: 1px solid #ffcaca;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* SWEETALERT FORM */

        .dlg {
            text-align: left;
        }

        .dlg label.lbl {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin: 12px 0 4px;
            color: #34415f;
        }

        .dlg .days-row label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin: 3px 10px 3px 0;
            font-size: 13px;
        }

        .dlg .days-row input {
            width: auto;
        }

        @media (max-width: 768px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 19px;
            }

            header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- ADMIN APP -->

    <div id="app" hidden>

        <header>
            <div class="header-content">

                <div class="logo">
                    <div class="logo-icon">🛡️</div>

                    <div>
                        <h1>Admin Panel</h1>
                        <p>Manage all accounts and subjects.</p>
                    </div>
                </div>

                <div class="header-actions">
                    <span class="admin-name">👤 <strong id="adminName"></strong></span>
                    <a href="index.html">← Schedule Maker</a>
                    <button type="button" onclick="refreshData()">⟳ Refresh</button>
                    <button type="button" onclick="adminLogout()">Log out</button>
                </div>

            </div>
        </header>

        <div class="container">

            <div id="errorBanner" hidden></div>

            <div class="stats">
                <div class="stat">
                    <small>TOTAL ACCOUNTS</small>
                    <strong id="statAccounts">0</strong>
                </div>

                <div class="stat">
                    <small>TOTAL SUBJECTS</small>
                    <strong id="statSubjects">0</strong>
                </div>

                <div class="stat">
                    <small>ACCOUNTS WITH NO SUBJECTS</small>
                    <strong id="statEmpty">0</strong>
                </div>
            </div>

            <section class="panel">

                <div class="tabs">
                    <button type="button" class="tab active" id="tabAccounts" onclick="showTab('accounts')">👥 Accounts</button>
                    <button type="button" class="tab" id="tabSubjects" onclick="showTab('subjects')">📚 Subjects</button>
                </div>

                <!-- ACCOUNTS -->

                <div id="accountsView">

                    <div class="toolbar">
                        <div class="grow">
                            <input type="text" id="accountSearch" placeholder="Search by name or course..."
                                oninput="renderAccounts()">
                        </div>

                        <button type="button" class="create-btn" onclick="addAccount()">+ Add Account</button>
                    </div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Course &amp; Year Level</th>
                                    <th>Subjects</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="accountList"></tbody>
                        </table>
                    </div>

                </div>

                <!-- SUBJECTS -->

                <div id="subjectsView" hidden>

                    <div class="toolbar">
                        <select id="subjectAccountFilter" onchange="renderSubjects()"></select>

                        <div class="grow">
                            <input type="text" id="subjectSearch" placeholder="Search code, subject, professor or room..."
                                oninput="renderSubjects()">
                        </div>

                        <button type="button" class="create-btn" onclick="addSubject()">+ Add Subject</button>

                        <button type="button" class="danger-btn" id="removeAllBtn" onclick="removeAllForAccount()">
                            🗑 Remove All of This Account
                        </button>
                    </div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Account</th>
                                    <th>Subject</th>
                                    <th>Professor</th>
                                    <th>Room</th>
                                    <th>Days</th>
                                    <th>Time</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="subjectList"></tbody>
                        </table>
                    </div>

                </div>

            </section>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="auth.js"></script>
    <script>
        const ADMIN_SESSION_KEY = "csm_admin_user";

        const COLORS = ["#fffbdc", "#dff4ff", "#fce1e1", "#e5f7e5", "#eee3ff", "#ffe9d5", "#e0f2f1", "#fce4ec"];
        const DAY_ORDER = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri"];

        let students = [];
        let subjects = [];

        // ---------- helpers ----------

        function esc(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
            })[char]);
        }

        function enc(value) {
            return encodeURIComponent(String(value));
        }

        function hhmm(time) {
            return String(time || "").slice(0, 5);
        }

        function timeToMinutes(time) {
            const [h, m] = hhmm(time).split(":").map(Number);
            return h * 60 + m;
        }

        function formatTime(time) {
            const [hour, minute] = hhmm(time).split(":").map(Number);
            return (hour % 12 || 12) + ":" + String(minute).padStart(2, "0") + " " + (hour >= 12 ? "PM" : "AM");
        }

        function sortDays(days) {
            return [...(days || [])].sort((a, b) => DAY_ORDER.indexOf(a) - DAY_ORDER.indexOf(b));
        }

        function studentById(id) {
            return students.find(s => String(s.id) === String(id));
        }

        function showError(message) {
            const banner = document.getElementById("errorBanner");
            banner.textContent = message || "";
            banner.hidden = !message;
        }

        // ---------- admin session (login / register are separate pages) ----------

        function getAdminSession() {
            try { return sessionStorage.getItem(ADMIN_SESSION_KEY); }
            catch (e) { return null; }
        }

        function adminLogout() {
            sessionStorage.removeItem(ADMIN_SESSION_KEY);
            window.location.href = "admin-login.html";
        }

        document.addEventListener("DOMContentLoaded", function () {
            const admin = getAdminSession();

            if (!admin) {
                window.location.href = "admin-login.html";
                return;
            }

            document.getElementById("adminName").textContent = admin;
            document.getElementById("app").hidden = false;

            refreshData();
        });

        // ---------- loading ----------

        async function refreshData() {

            if (!USE_SUPABASE) {
                showError("Supabase is not configured in auth.js, so the admin panel has no data to manage.");
                return;
            }

            try {
                showError("");

                const [studentRows, subjectRows] = await Promise.all([
                    sb("students?select=*&order=name.asc"),
                    sb("subjects?select=*&order=student_id.asc,position.asc")
                ]);

                students = studentRows || [];
                subjects = subjectRows || [];

                renderAll();

            } catch (error) {
                console.error(error);
                showError("Could not load data: " + error.message);
            }
        }

        function renderAll() {
            renderStats();
            renderFilterOptions();
            renderAccounts();
            renderSubjects();
        }

        function subjectCount(studentId) {
            return subjects.filter(s => String(s.student_id) === String(studentId)).length;
        }

        function renderStats() {
            document.getElementById("statAccounts").textContent = students.length;
            document.getElementById("statSubjects").textContent = subjects.length;
            document.getElementById("statEmpty").textContent =
                students.filter(s => subjectCount(s.id) === 0).length;
        }

        function renderFilterOptions() {
            const select = document.getElementById("subjectAccountFilter");
            const previous = select.value || "all";

            select.innerHTML = '<option value="all">All accounts</option>' +
                students.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");

            select.value = students.some(s => String(s.id) === previous) ? previous : "all";
        }

        // ---------- tabs ----------

        function showTab(tab) {
            const isAccounts = tab === "accounts";

            document.getElementById("accountsView").hidden = !isAccounts;
            document.getElementById("subjectsView").hidden = isAccounts;
            document.getElementById("tabAccounts").classList.toggle("active", isAccounts);
            document.getElementById("tabSubjects").classList.toggle("active", !isAccounts);
        }

        // ---------- accounts ----------

        function renderAccounts() {
            const query = document.getElementById("accountSearch").value.trim().toLowerCase();
            const tbody = document.getElementById("accountList");

            const rows = students.filter(s =>
                !query ||
                String(s.name || "").toLowerCase().includes(query) ||
                String(s.course || "").toLowerCase().includes(query)
            );

            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="4" class="muted">No accounts found.</td></tr>';
                return;
            }

            tbody.innerHTML = rows.map(s => `
                <tr>
                    <td class="left"><strong>${esc(s.name)}</strong></td>
                    <td>${esc(s.course)}</td>
                    <td><span class="badge">${subjectCount(s.id)}</span></td>
                    <td>
                        <div class="action-buttons">
                            <button type="button" class="view-btn" data-act="view-account" data-id="${esc(s.id)}">Subjects</button>
                            <button type="button" class="edit-btn" data-act="edit-account" data-id="${esc(s.id)}">Edit</button>
                            <button type="button" class="delete-btn" data-act="delete-account" data-id="${esc(s.id)}">Delete</button>
                        </div>
                    </td>
                </tr>`).join("");
        }

        document.getElementById("accountList").addEventListener("click", function (e) {
            const button = e.target.closest("button[data-act]");
            if (!button) return;

            const id = button.dataset.id;

            if (button.dataset.act === "edit-account") editAccount(id);
            if (button.dataset.act === "delete-account") deleteAccount(id);
            if (button.dataset.act === "view-account") {
                document.getElementById("subjectAccountFilter").value = id;
                document.getElementById("subjectSearch").value = "";
                renderSubjects();
                showTab("subjects");
            }
        });

        function accountDialog(title, account) {
            return Swal.fire({
                title,
                width: 460,
                html: `
                    <div class="dlg">
                        <label class="lbl">Full Name</label>
                        <input id="dName" type="text" value="${esc(account.name)}">

                        <label class="lbl">Course &amp; Year Level</label>
                        <input id="dCourse" type="text" value="${esc(account.course)}" placeholder="e.g. BSIT - 3rd Year">
                    </div>`,
                showCancelButton: true,
                confirmButtonText: "Save",
                confirmButtonColor: "#315bea",
                focusConfirm: false,
                preConfirm: () => {
                    const name = document.getElementById("dName").value.trim().replace(/\s+/g, " ");
                    const course = document.getElementById("dCourse").value.trim();

                    if (!name || !course) {
                        Swal.showValidationMessage("Name and course/year level are required.");
                        return false;
                    }

                    return { name, course };
                }
            });
        }

        function nameTaken(name, ignoreId) {
            const key = normalizeName(name);

            return students.some(s =>
                String(s.id) !== String(ignoreId) && normalizeName(s.name) === key
            );
        }

        async function addAccount() {
            const result = await accountDialog("Add account", { name: "", course: "" });

            if (!result.isConfirmed) return;

            const { name, course } = result.value;

            if (nameTaken(name)) {
                notify("That name is already registered.", "error", "Already registered");
                return;
            }

            try {
                await sb("students", { method: "POST", body: { name, course } });
                toast("Account added");
                await refreshData();
            } catch (error) {
                console.error(error);
                notify(error.status === 409 ? "That name is already registered." : error.message, "error");
            }
        }

        async function editAccount(id) {
            const account = studentById(id);
            if (!account) return;

            const result = await accountDialog("Edit account", account);

            if (!result.isConfirmed) return;

            const { name, course } = result.value;

            if (nameTaken(name, id)) {
                notify("Another account already uses that name.", "error", "Name already used");
                return;
            }

            try {
                const rows = await sb("students?id=eq." + enc(id), {
                    method: "PATCH",
                    body: { name, course }
                });

                // make sure the login key matches the new name
                const row = rows && rows[0];
                const newKey = normalizeName(name);

                if (row && "name_key" in row && row.name_key !== newKey) {
                    try {
                        await sb("students?id=eq." + enc(id), {
                            method: "PATCH",
                            body: { name_key: newKey }
                        });
                    } catch (e) {
                        console.error(e);
                    }
                }

                toast("Account updated");
                await refreshData();

            } catch (error) {
                console.error(error);
                notify(error.status === 409 ? "Another account already uses that name." : error.message, "error");
            }
        }

        async function deleteAccount(id) {
            const account = studentById(id);
            if (!account) return;

            const count = subjectCount(id);

            const ok = await confirmDialog(
                "Delete this account?",
                account.name + " and " + count + " subject(s) will be permanently removed.",
                "Yes, delete account"
            );

            if (!ok) return;

            try {
                await sb("subjects?student_id=eq." + enc(id), { method: "DELETE", prefer: "return=minimal" });
                await sb("students?id=eq." + enc(id), { method: "DELETE", prefer: "return=minimal" });

                toast("Account deleted");
                await refreshData();
            } catch (error) {
                console.error(error);
                notify(error.message, "error", "Could not delete");
            }
        }

        // ---------- subjects ----------

        function renderSubjects() {
            const filter = document.getElementById("subjectAccountFilter").value;
            const query = document.getElementById("subjectSearch").value.trim().toLowerCase();
            const tbody = document.getElementById("subjectList");

            document.getElementById("removeAllBtn").disabled = filter === "all";

            const rows = subjects.filter(s => {
                if (filter !== "all" && String(s.student_id) !== String(filter)) return false;

                if (!query) return true;

                return [s.code, s.name, s.professor, s.room]
                    .some(value => String(value || "").toLowerCase().includes(query));
            });

            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="muted">No subjects found.</td></tr>';
                return;
            }

            tbody.innerHTML = rows.map(s => {
                const owner = studentById(s.student_id);

                return `
                <tr>
                    <td class="left">${owner ? esc(owner.name) : '<span class="muted">Unknown</span>'}</td>
                    <td class="left">
                        <span class="swatch" style="background:${esc(s.color || "#fff")}"></span>
                        <strong>${esc(s.code)}</strong><br>${esc(s.name)}
                    </td>
                    <td>${esc(s.professor)}</td>
                    <td>${esc(s.room)}</td>
                    <td>${esc(sortDays(s.days).join(", "))}</td>
                    <td>${esc(formatTime(s.start_time))} - ${esc(formatTime(s.end_time))}</td>
                    <td>
                        <div class="action-buttons">
                            <button type="button" class="edit-btn" data-act="edit-subject" data-id="${esc(s.id)}">Edit</button>
                            <button type="button" class="delete-btn" data-act="delete-subject" data-id="${esc(s.id)}">Delete</button>
                        </div>
                    </td>
                </tr>`;
            }).join("");
        }

        document.getElementById("subjectList").addEventListener("click", function (e) {
            const button = e.target.closest("button[data-act]");
            if (!button) return;

            if (button.dataset.act === "edit-subject") editSubject(button.dataset.id);
            if (button.dataset.act === "delete-subject") deleteSubject(button.dataset.id);
        });

        function validateSubject(data, studentId, ignoreId) {

            if (!data.code || !data.name) return "Subject code and name are required.";
            if (!data.start_time || !data.end_time) return "Please set the start and end time.";
            if (!data.days.length) return "Please select at least one class day.";

            const start = timeToMinutes(data.start_time);
            const end = timeToMinutes(data.end_time);

            if (start >= end) return "End time must be later than start time.";
            if (start % 30 !== 0 || end % 30 !== 0) return "Please use 30-minute intervals.";
            if (start < 420 || end > 1080) return "Class time must be between 7:00 AM and 6:00 PM.";

            for (const day of data.days) {
                const conflict = subjects.some(s =>
                    String(s.student_id) === String(studentId) &&
                    String(s.id) !== String(ignoreId) &&
                    (s.days || []).includes(day) &&
                    start < timeToMinutes(s.end_time) &&
                    end > timeToMinutes(s.start_time)
                );

                if (conflict) return "Schedule conflict detected on " + day + " for this account.";
            }

            return "";
        }

        function subjectDialog(title, subject, ownerId, lockOwner) {

            const field = (id, label, value, type = "text") => `
                <label class="lbl">${label}</label>
                <input id="${id}" type="${type}" value="${esc(value)}">`;

            const ownerOptions = students.map(s =>
                `<option value="${esc(s.id)}" ${String(s.id) === String(ownerId) ? "selected" : ""}>${esc(s.name)}</option>`
            ).join("");

            const dayBoxes = DAY_ORDER.map(day => `
                <label>
                    <input type="checkbox" class="dlg-day" value="${day}" ${(subject.days || []).includes(day) ? "checked" : ""}>
                    ${day}
                </label>`).join("");

            return Swal.fire({
                title,
                width: 520,
                html: `
                    <div class="dlg">
                        <label class="lbl">Account</label>
                        <select id="dOwner" ${lockOwner ? "disabled" : ""}>${ownerOptions}</select>

                        ${field("dCode", "Subject Code", subject.code)}
                        ${field("dSubject", "Subject Name", subject.name)}
                        ${field("dProfessor", "Professor Name", subject.professor)}
                        ${field("dRoom", "Room / Classroom", subject.room)}
                        ${field("dStart", "Start Time", hhmm(subject.start_time) || "07:00", "time")}
                        ${field("dEnd", "End Time", hhmm(subject.end_time) || "08:00", "time")}

                        <label class="lbl">Class Days (Saturday is reserved for Church)</label>
                        <div class="days-row">${dayBoxes}</div>
                    </div>`,
                showCancelButton: true,
                confirmButtonText: "Save",
                confirmButtonColor: "#315bea",
                focusConfirm: false,
                preConfirm: () => {
                    const studentId = document.getElementById("dOwner").value;

                    const data = {
                        code: document.getElementById("dCode").value.trim(),
                        name: document.getElementById("dSubject").value.trim(),
                        professor: document.getElementById("dProfessor").value.trim(),
                        room: document.getElementById("dRoom").value.trim(),
                        start_time: document.getElementById("dStart").value,
                        end_time: document.getElementById("dEnd").value,
                        days: Array.from(document.querySelectorAll(".dlg-day:checked")).map(box => box.value)
                    };

                    if (!studentId) {
                        Swal.showValidationMessage("Please choose an account.");
                        return false;
                    }

                    const problem = validateSubject(data, studentId, subject.id);

                    if (problem) {
                        Swal.showValidationMessage(problem);
                        return false;
                    }

                    return { studentId, data };
                }
            });
        }

        async function addSubject() {

            if (!students.length) {
                notify("Add an account first.", "info", "No accounts yet");
                return;
            }

            const filter = document.getElementById("subjectAccountFilter").value;
            const ownerId = filter !== "all" ? filter : students[0].id;

            const result = await subjectDialog("Add subject", { days: [] }, ownerId, false);

            if (!result.isConfirmed) return;

            const { studentId, data } = result.value;
            const count = subjectCount(studentId);

            try {
                await sb("subjects", {
                    method: "POST",
                    prefer: "return=minimal",
                    body: {
                        student_id: studentId,
                        position: count,
                        ...data,
                        color: COLORS[count % COLORS.length]
                    }
                });

                toast("Subject added");
                await refreshData();
            } catch (error) {
                console.error(error);
                notify(error.message, "error", "Could not add subject");
            }
        }

        async function editSubject(id) {
            const subject = subjects.find(s => String(s.id) === String(id));
            if (!subject) return;

            const result = await subjectDialog("Edit subject", subject, subject.student_id, true);

            if (!result.isConfirmed) return;

            try {
                await sb("subjects?id=eq." + enc(id), {
                    method: "PATCH",
                    prefer: "return=minimal",
                    body: result.value.data
                });

                toast("Subject updated");
                await refreshData();
            } catch (error) {
                console.error(error);
                notify(error.message, "error", "Could not update subject");
            }
        }

        async function deleteSubject(id) {
            const subject = subjects.find(s => String(s.id) === String(id));
            if (!subject) return;

            const owner = studentById(subject.student_id);

            const ok = await confirmDialog(
                "Delete this subject?",
                subject.code + " - " + subject.name + (owner ? " will be removed from " + owner.name + "'s schedule." : " will be removed."),
                "Yes, delete it"
            );

            if (!ok) return;

            try {
                await sb("subjects?id=eq." + enc(id), { method: "DELETE", prefer: "return=minimal" });

                toast("Subject deleted");
                await refreshData();
            } catch (error) {
                console.error(error);
                notify(error.message, "error", "Could not delete");
            }
        }

        async function removeAllForAccount() {
            const filter = document.getElementById("subjectAccountFilter").value;
            if (filter === "all") return;

            const account = studentById(filter);
            const count = subjectCount(filter);

            if (!account) return;

            if (!count) {
                notify("This account has no subjects.", "info", "Nothing to remove");
                return;
            }

            const ok = await confirmDialog(
                "Remove all subjects?",
                "All " + count + " subject(s) of " + account.name + " will be permanently removed.",
                "Yes, remove all"
            );

            if (!ok) return;

            try {
                await sb("subjects?student_id=eq." + enc(filter), { method: "DELETE", prefer: "return=minimal" });

                toast("All subjects removed");
                await refreshData();
            } catch (error) {
                console.error(error);
                notify(error.message, "error", "Could not remove");
            }
        }
    </script>

</body>

</html>
